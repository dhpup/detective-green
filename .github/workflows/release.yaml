# Builds, scans, signs and publishes our images when a version tag is pushed.
# Every action is pinned by commit SHA (tag in the comment).
#
# For each image: build amd64 -> Trivy scan (fails on fixable HIGH/CRITICAL)
# -> build amd64+arm64 with SBOM and provenance attestations -> push to
# ghcr.io/<owner>/<image>:<tag> -> keyless cosign signature on the digest.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signing via GitHub OIDC
    strategy:
      fail-fast: true
      matrix:
        image: [case-file, evidence-kit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load pinned versions
        run: grep -E '^[A-Z0-9_]+=' versions.env >> "$GITHUB_ENV"

      - name: Image name
        id: name
        env:
          IMAGE: ${{ matrix.image }}
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for scanning (amd64, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src/${{ matrix.image }}
          platforms: linux/amd64
          load: true
          tags: scan:local
          build-args: |
            VERSION=${{ github.ref_name }}
            GO_IMAGE=${{ env.GO_BUILD_IMAGE }}
            BASE_IMAGE=${{ matrix.image == 'case-file' && env.DISTROLESS_STATIC_IMAGE || env.ALPINE_IMAGE }}

      - name: Scan (fails on fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore.yaml:/.trivyignore.yaml:ro" "$TRIVY_IMAGE" \
            image --exit-code 1 --ignore-unfixed --severity CRITICAL,HIGH \
            --ignorefile /.trivyignore.yaml scan:local

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.ref }}
          tags: type=ref,event=tag

      - name: Build and push (amd64 + arm64, SBOM + provenance)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src/${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            GO_IMAGE=${{ env.GO_BUILD_IMAGE }}
            BASE_IMAGE=${{ matrix.image == 'case-file' && env.DISTROLESS_STATIC_IMAGE || env.ALPINE_IMAGE }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign (keyless)
        env:
          REF: ${{ steps.name.outputs.ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REF}@${DIGEST}"

      - name: Summary
        env:
          REF: ${{ steps.name.outputs.ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### ${REF}:${GITHUB_REF_NAME}"
            echo '```'
            echo "${REF}@${DIGEST}"
            echo '```'
            echo "Verify with:"
            echo '```'
            echo "cosign verify ${REF}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yaml@refs/tags/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
