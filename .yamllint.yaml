extends: default
ignore: |
  .cache/
rules:
  document-start: disable # most Kubernetes manifests don't use "---" at the top
  line-length:
    max: 160
    ignore: |
      apps/observability/manifests/precinct-board.yaml
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable  # flags legitimate spec-level comments after nested lists
  indentation:
    indent-sequences: whatever # both styles are common in Kubernetes YAML
  truthy:
    check-keys: false # "on:" in GitHub workflows
