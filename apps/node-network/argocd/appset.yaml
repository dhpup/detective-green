# One Argo CD Application per environment directory. Each tracks the RENDERED
# branch rendered/node-network/<stage>, not main. Kargo creates and updates those
# branches on promotion, then syncs the Application (argocd-update).
# The env directory name is also the Argo CD cluster name.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: node-network
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/dhpup/detective-green.git
      revision: HEAD
      directories:
      - path: apps/node-network/env/*
  template:
    metadata:
      name: 'node-network-{{.path.basename}}'
      annotations:
        # Authorizes the matching Kargo Stage to update and sync this Application.
        kargo.akuity.io/authorized-stage: 'node-network:{{.path.basename}}'
    spec:
      project: node-network
      source:
        repoURL: https://github.com/dhpup/detective-green.git
        targetRevision: 'rendered/node-network/{{.path.basename}}'
        path: ./
      destination:
        name: '{{.path.basename}}'
        namespace: 'node-network-{{.path.basename}}'
