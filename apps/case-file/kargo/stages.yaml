apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: case-file
  annotations:
    kargo.akuity.io/color: amber
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: case-file
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - task:
          name: promote
  # The gate: Freight only becomes eligible for prod after these pass. The
  # checks are shared ClusterAnalysisTemplates (kargo-shared/): a payload sweep
  # through the app, plus what staging's network says (eth0 drops, large-payload
  # success, policy drops).
  verification:
    analysisTemplates:
    - kind: ClusterAnalysisTemplate
      name: payload-sweep
    - kind: ClusterAnalysisTemplate
      name: network-signals
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: case-file
  annotations:
    kargo.akuity.io/color: red
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: case-file
    sources:
      stages:
      - staging
  promotionTemplate:
    spec:
      steps:
      - task:
          name: promote
