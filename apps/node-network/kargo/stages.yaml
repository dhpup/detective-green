apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: node-network
  annotations:
    kargo.akuity.io/color: amber
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: node-network
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - task:
          name: promote
  # Platform changes are app changes: node config has to pass the same checks
  # as the app before it can reach prod.
  verification:
    analysisTemplates:
    - kind: ClusterAnalysisTemplate
      name: payload-sweep
    - kind: ClusterAnalysisTemplate
      name: network-signals
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: node-network
  annotations:
    kargo.akuity.io/color: red
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: node-network
    sources:
      stages:
      - staging
  promotionTemplate:
    spec:
      steps:
      - task:
          name: promote
